# Three-seed V3 calibration run. Checkpoint selection uses generated full-validation metrics.
model: "mlx-community/Qwen3.5-0.8B-4bit"
train: true
data: "data/v3/mlx/outcome-count"
fine_tune_type: "lora"
num_layers: 16
batch_size: 1
iters: 400
val_batches: -1
learning_rate: 1.0e-5
