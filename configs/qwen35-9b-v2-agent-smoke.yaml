# Verifies the prompt-disjoint epistemic target with Qwen3.5-9B.
model: "mlx-community/Qwen3.5-9B-4bit"
train: true
data: "data/v2/mlx/agent"
fine_tune_type: "lora"
num_layers: 4
batch_size: 1
iters: 5
val_batches: 4
learning_rate: 1.0e-5
steps_per_report: 1
steps_per_eval: 5
save_every: 5
max_seq_length: 1536
grad_checkpoint: true
mask_prompt: true
adapter_path: "adapters/qwen35-9b-v2-agent-smoke"
test: true
test_batches: 4
